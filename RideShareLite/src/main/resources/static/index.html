<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideShareLite | Campus Carpool</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--muted:#6b7285;--brand:#2563eb;--ok:#16a34a;--bad:#dc2626;--line:#e3e7f0}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(120deg,#1e3a8a,#2563eb);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  header h1{margin:0;font-size:22px}header small{opacity:.8;display:block}
  .me{display:flex;gap:8px;align-items:center;font-size:14px}.me select{padding:6px 8px;border-radius:8px;border:0}
  nav{display:flex;gap:6px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
  nav button.active{background:var(--brand);color:#fff}
  main{max-width:1000px;margin:22px auto;padding:0 18px}
  section{display:none}section.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  h2{margin:0 0 12px;font-size:18px}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;align-items:end}
  label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  input,select{padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  button.btn{background:var(--brand);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
  button.btn.ok{background:var(--ok)}button.btn.bad{background:var(--bad)}button.btn.ghost{background:#eef2ff;color:var(--brand)}
  table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);text-transform:uppercase}
  .tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#e5e7eb}
  .OPEN,.APPROVED{background:#dcfce7;color:#166534}.FULL,.PENDING{background:#fef3c7;color:#92400e}.CANCELLED,.REJECTED{background:#fee2e2;color:#991b1b}
  .empty{color:var(--muted);padding:10px 0}
  #toast{position:fixed;bottom:22px;right:22px;padding:12px 18px;border-radius:10px;color:#fff;display:none;max-width:380px;box-shadow:0 8px 24px #0003}
</style>
</head>
<body>
<header>
  <div><h1>RideShareLite</h1><small>Office / College Carpool Matching Platform</small></div>
  <div class="me">Acting as: <select id="me"></select></div>
</header>
<nav id="nav">
  <button data-tab="find" class="active">Find a ride</button>
  <button data-tab="publish">Publish a route</button>
  <button data-tab="driver">My rides &amp; approvals</button>
  <button data-tab="history">My history</button>
  <button data-tab="users">Users</button>
</nav>
<main>
  <section id="find" class="active">
    <div class="card"><h2>Search matching rides</h2>
      <form id="searchForm">
        <label>Origin<input name="origin" placeholder="e.g. Gandhipuram"></label>
        <label>Destination<input name="destination" placeholder="e.g. College"></label>
        <label>Leave after<input name="from" type="datetime-local"></label>
        <label>Leave before<input name="to" type="datetime-local"></label>
        <button class="btn">Search</button>
      </form></div>
    <div class="card"><h2>Available rides</h2><div id="results"><div class="empty">Run a search to see rides.</div></div></div>
  </section>

  <section id="publish">
    <div class="card"><h2>Publish a route (as the selected user)</h2>
      <form id="publishForm">
        <label>Origin<input name="origin" required></label>
        <label>Destination<input name="destination" required></label>
        <label>Departure time<input name="departureTime" type="datetime-local" required></label>
        <label>Seats offered<input name="totalSeats" type="number" min="1" max="8" value="3" required></label>
        <button class="btn">Publish ride</button>
      </form></div>
  </section>

  <section id="driver">
    <div class="card"><h2>Rides I published</h2><div id="myRides"></div></div>
    <div class="card"><h2>Requests waiting on my rides</h2><div id="incoming"></div></div>
  </section>

  <section id="history">
    <div class="card"><h2>As a driver</h2><div id="histDriver"></div></div>
    <div class="card"><h2>As a rider</h2><div id="histRider"></div></div>
  </section>

  <section id="users">
    <div class="card"><h2>Register a user</h2>
      <form id="userForm">
        <label>Name<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Phone<input name="phone" placeholder="optional"></label>
        <button class="btn">Add user</button>
      </form></div>
    <div class="card"><h2>All users</h2><div id="userList"></div></div>
  </section>
</main>
<div id="toast"></div>

<script>
const API = '/api';
const $ = s => document.querySelector(s);
let users = [];

function toast(msg, ok = true) {
  const t = $('#toast'); t.textContent = msg; t.style.background = ok ? '#16a34a' : '#dc2626';
  t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000);
}
async function api(path, opts = {}) {
  const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error([body.message, ...(body.details || [])].filter(Boolean).join(' | ') || 'Request failed');
  return body;
}
const me = () => Number($('#me').value);
const fmt = d => new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const tag = s => `<span class="tag ${s}">${s}</span>`;
const withSeconds = v => v && v.length === 16 ? v + ':00' : v;
async function run(fn) { try { await fn(); } catch (e) { toast(e.message, false); } }

function table(head, rows) {
  if (!rows.length) return '<div class="empty">Nothing here yet.</div>';
  return `<table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

/* ---------- users ---------- */
async function loadUsers() {
  users = await api('/users');
  const keep = $('#me').value;
  $('#me').innerHTML = users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
  if (keep) $('#me').value = keep;
  $('#userList').innerHTML = table(['ID', 'Name', 'Email', 'Phone', ''],
    users.map(u => [u.id, u.name, u.email, u.phone || '-', `<button class="btn bad" onclick="delUser(${u.id})">Delete</button>`]));
}
window.delUser = id => run(async () => { await api('/users/' + id, { method: 'DELETE' }); toast('User deleted'); await loadUsers(); });
$('#userForm').onsubmit = e => { e.preventDefault(); run(async () => {
  const f = Object.fromEntries(new FormData(e.target)); if (!f.phone) delete f.phone;
  await api('/users', { method: 'POST', body: JSON.stringify(f) });
  e.target.reset(); toast('User added'); await loadUsers();
}); };

/* ---------- publish ---------- */
$('#publishForm').onsubmit = e => { e.preventDefault(); run(async () => {
  const f = Object.fromEntries(new FormData(e.target));
  await api('/rides', { method: 'POST', body: JSON.stringify({ driverId: me(), origin: f.origin, destination: f.destination,
    departureTime: withSeconds(f.departureTime), totalSeats: Number(f.totalSeats) }) });
  e.target.reset(); toast('Ride published'); 
}); };

/* ---------- find + request ---------- */
$('#searchForm').onsubmit = e => { e.preventDefault(); run(search); };
async function search() {
  const f = Object.fromEntries(new FormData($('#searchForm')));
  const q = new URLSearchParams();
  if (f.origin) q.set('origin', f.origin); if (f.destination) q.set('destination', f.destination);
  if (f.from) q.set('from', withSeconds(f.from)); if (f.to) q.set('to', withSeconds(f.to));
  const rides = await api('/rides/search?' + q);
  $('#results').innerHTML = table(['Driver', 'Route', 'Departs', 'Seats left', ''],
    rides.map(r => [r.driver.name, `${r.origin} → ${r.destination}`, fmt(r.departureTime), `${r.availableSeats}/${r.totalSeats}`,
      `<button class="btn" onclick="requestSeat(${r.id})">Request seat</button>`]));
}
window.requestSeat = id => run(async () => {
  await api('/requests', { method: 'POST', body: JSON.stringify({ riderId: me(), rideOfferId: id }) });
  toast('Seat requested - waiting for the driver'); await search();
});

/* ---------- driver view ---------- */
async function loadDriver() {
  const hist = await api(`/users/${me()}/history`);
  $('#myRides').innerHTML = table(['Route', 'Departs', 'Seats', 'Status', ''],
    hist.asDriver.map(r => [`${r.origin} → ${r.destination}`, fmt(r.departureTime), `${r.availableSeats}/${r.totalSeats}`, tag(r.status),
      r.status !== 'CANCELLED' ? `<button class="btn bad" onclick="cancelRide(${r.id})">Cancel ride</button>` : '']));
  const all = await Promise.all(hist.asDriver.filter(r => r.status !== 'CANCELLED').map(r => api('/requests/ride/' + r.id)));
  const reqs = all.flat();
  $('#incoming').innerHTML = table(['Rider', 'Ride', 'Requested', 'Status', ''],
    reqs.map(q => [q.rider.name, `${q.rideOffer.origin} → ${q.rideOffer.destination}`, fmt(q.requestedAt), tag(q.status),
      q.status === 'PENDING' ? `<button class="btn ok" onclick="decide(${q.id},'approve')">Approve</button> <button class="btn bad" onclick="decide(${q.id},'reject')">Reject</button>` : '']));
}
window.decide = (id, action) => run(async () => { await api(`/requests/${id}/${action}?driverId=${me()}`, { method: 'PUT' }); toast('Request ' + action + 'd'); await loadDriver(); });
window.cancelRide = id => run(async () => { await api(`/rides/${id}?driverId=${me()}`, { method: 'DELETE' }); toast('Ride cancelled'); await loadDriver(); });

/* ---------- history ---------- */
async function loadHistory() {
  const h = await api(`/users/${me()}/history`);
  $('#histDriver').innerHTML = table(['Route', 'Departs', 'Seats', 'Status'],
    h.asDriver.map(r => [`${r.origin} → ${r.destination}`, fmt(r.departureTime), `${r.availableSeats}/${r.totalSeats}`, tag(r.status)]));
  $('#histRider').innerHTML = table(['Route', 'Driver', 'Departs', 'Status', ''],
    h.asRider.map(q => [`${q.rideOffer.origin} → ${q.rideOffer.destination}`, q.rideOffer.driver.name, fmt(q.rideOffer.departureTime), tag(q.status),
      ['PENDING', 'APPROVED'].includes(q.status) ? `<button class="btn ghost" onclick="cancelReq(${q.id})">Cancel</button>` : '']));
}
window.cancelReq = id => run(async () => { await api(`/requests/${id}/cancel?riderId=${me()}`, { method: 'PUT' }); toast('Request cancelled'); await loadHistory(); });

/* ---------- tabs ---------- */
const loaders = { driver: loadDriver, history: loadHistory, users: loadUsers };
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#nav button, section').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); $('#' + b.dataset.tab).classList.add('active');
  if (loaders[b.dataset.tab]) run(loaders[b.dataset.tab]);
});
$('#me').onchange = () => { const t = document.querySelector('#nav button.active').dataset.tab; if (loaders[t]) run(loaders[t]); };
run(loadUsers);
</script>
</body>
</html>
